services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deployhaven
      POSTGRES_PASSWORD: deployhaven
      POSTGRES_DB: deployhaven
    ports:
      - "5432:5432"
    volumes:
      - dh_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployhaven"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - dh_redis:/data
volumes:
  dh_pg:
  dh_redis:
